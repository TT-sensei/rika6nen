<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8. 大地のつくりと変化 - 理科アプリ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .earth-box {
            background: #fff; padding: 20px; border-radius: 10px;
            max-width: 700px; margin: 20px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* 地層の表示エリア */
        .ground-container {
            width: 100%; height: 350px; background: #e0f7fa; /* 最初は海 */
            border: 4px solid #333; border-radius: 5px;
            position: relative; overflow: hidden; display: flex;
            margin-bottom: 20px;
        }

        /* 断層（ズレ）を表現するために左右に分ける */
        .ground-left, .ground-right {
            width: 50%; height: 100%;
            display: flex; flex-direction: column-reverse; /* 下から上に積む */
            transition: transform 0.5s ease-in-out;
        }
        
        .ground-right {
            border-left: 2px dashed rgba(0,0,0,0.2);
        }

        /* 地層（レイヤー）のスタイル */
        .layer {
            width: 100%; height: 50px; 
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.9rem; color: #333;
            box-sizing: border-box; border-top: 1px solid rgba(0,0,0,0.3);
            animation: dropLayer 0.5s ease-out;
        }

        @keyframes dropLayer {
            0% { transform: translateY(-100px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* 種類ごとの模様・色 */
        .layer-reki { background: #95a5a6; background-image: radial-gradient(#7f8c8d 20%, transparent 20%); background-size: 15px 15px; } /* れき：ツブが大きい */
        .layer-suna { background: #f1c40f; background-image: radial-gradient(#d4ac0d 15%, transparent 15%); background-size: 8px 8px; } /* 砂：ツブが中くらい */
        .layer-doro { background: #8d6e63; } /* 泥：ツブが小さい（模様なし） */
        .layer-ash { background: #ecf0f1; border: 3px solid #e74c3c; color: #c0392b; } /* 火山灰：白っぽく目立つ（鍵層） */

        .controls {
            background: #f1f2f6; padding: 20px; border-radius: 10px; margin-bottom: 20px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }

        .btn {
            padding: 10px; font-size: 1rem; font-weight: bold; border: none;
            border-radius: 5px; cursor: pointer; transition: 0.2s; color: white;
        }
        .btn:active { transform: scale(0.95); }
        .btn-reki { background: #7f8c8d; }
        .btn-suna { background: #f39c12; }
        .btn-doro { background: #8d6e63; }
        .btn-ash { background: #e74c3c; }
        .btn-quake { background: #2c3e50; grid-column: span 2; padding: 15px; font-size: 1.2rem; }

        .history-log {
            text-align: left; background: #fffde7; padding: 15px;
            border-left: 5px solid #fbc02d; font-size: 0.9rem;
            height: 120px; overflow-y: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="color:white;">🌋 8. 大地のつくりと変化</h1>
        <p>長い時間をかけて、自分だけの地層を作ろう！</p>
    </header>

    <main>
        <div class="earth-box">
            
            <div class="ground-container" id="ground">
                <div class="ground-left" id="left-stack"></div>
                <div class="ground-right" id="right-stack"></div>
            </div>

            <div class="controls">
                <button class="btn btn-reki" onclick="addLayer('reki', 'れき（小石）', '川の流れが速い時期に、大きな粒のれきが運ばれて積もった。')">🪨 れき を積む</button>
                <button class="btn btn-suna" onclick="addLayer('suna', '砂', '川の流れが少しおだやかになり、砂が運ばれて積もった。')">🏖️ 砂 を積む</button>
                <button class="btn btn-doro" onclick="addLayer('doro', '泥（貝の化石入り）', '川の流れがとても静かになり、軽い泥が遠くまで運ばれて積もった。浅い海だったため貝の化石が混ざった！')">🐚 泥 を積む</button>
                <button class="btn btn-ash" onclick="addLayer('ash', '火山灰', '大噴火が発生！火山灰が降り積もった。（これを「かぎ層」というよ）')">🌋 火山灰 を積む</button>
                <button class="btn btn-quake" onclick="triggerEarthquake()">⚡ 地震を起こす（断層を作る）</button>
            </div>

            <div class="history-log" id="log">
                <strong>【大地の歴史記録】</strong><br>
                ここは深い海だ。まだ何も積もっていない…。<br>
            </div>

            <div style="margin-top: 20px; text-align: left;">
                <a href="index.html" style="color: #4CAF50; text-decoration: none; font-weight:bold;">← メニューに戻る</a>
            </div>
        </div>
    </main>

    <script>
        let layerCount = 0;
        let isQuakeHappened = false;
        const maxLayers = 6; // 最大6層まで

        const leftStack = document.getElementById('left-stack');
        const rightStack = document.getElementById('right-stack');
        const log = document.getElementById('log');

        function addLayer(type, name, description) {
            if (layerCount >= maxLayers) {
                alert("これ以上地層は積めません！何万年も経ちました。");
                return;
            }

            layerCount++;

            // 左側の層を作る
            const layerL = document.createElement('div');
            layerL.className = `layer layer-${type}`;
            layerL.innerText = name;
            leftStack.appendChild(layerL);

            // 右側の層を作る
            const layerR = document.createElement('div');
            layerR.className = `layer layer-${type}`;
            layerR.innerText = name;
            rightStack.appendChild(layerR);

            // 歴史ログに追加（新しい記録を一番上に）
            log.innerHTML = `・${layerCount}層目：${description}<br>` + log.innerHTML;
        }

        function triggerEarthquake() {
            if (layerCount === 0) {
                alert("地層がない状態で地震が起きても、変化がわかりません！まずは地層を作ろう。");
                return;
            }
            if (isQuakeHappened) {
                alert("すでに大きな断層ができています！");
                return;
            }

            // 右側の地層を下にズラす（断層の表現）
            rightStack.style.transform = "translateY(30px)";
            isQuakeHappened = true;

            log.innerHTML = `<span style="color:red; font-weight:bold;">・大地震発生！大地に強い力がはたらき、地層がズレて「断層（だんそう）」ができた！</span><br>` + log.innerHTML;
        }
    </script>
</body>
</html>
