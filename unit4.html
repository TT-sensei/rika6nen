<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理科室の探偵！謎の液体Xの正体をあばけ</title>
    <style>
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
            background-color: #2c3e50;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .game-container {
            background-color: #fdfbf7;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            padding: 20px;
            border: 4px solid #8e44ad;
            position: relative;
        }
        h1 {
            text-align: center;
            color: #8e44ad;
            font-size: 24px;
            border-bottom: 2px dashed #8e44ad;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .settings-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f0f3f4;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        select {
            padding: 5px 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #bdc3c7;
        }
        .story-box {
            background-color: #e8f8f5;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #16a085;
            text-align: center;
            line-height: 1.5;
        }
        .flex-area {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 700px) {
            .flex-area { flex-direction: column; }
            .settings-bar { flex-direction: column; gap: 10px; }
        }
        .tools-area, .log-area {
            flex: 1;
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
        }
        h2 {
            font-size: 18px;
            color: #2980b9;
            margin-top: 0;
            text-align: center;
        }
        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 500px) {
            .tool-grid { grid-template-columns: 1fr; }
        }
        .btn-tool {
            width: 100%;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }
        .btn-tool:hover:not(:disabled) { background-color: #2980b9; }
        .btn-tool:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            opacity: 0.8;
        }
        
        #investigation-log {
            height: 350px;
            overflow-y: auto;
            background: white;
            border: 1px solid #bdc3c7;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .log-item { margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        .log-item span { font-weight: bold; color: #e74c3c; }

        .inference-area {
            background-color: #fff3e0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #e67e22;
        }
        .btn-hint {
            background-color: #f1c40f;
            color: #333;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .btn-hint:active { transform: scale(0.95); }
        .btn-hint:hover { background-color: #f39c12; color: white;}

        .suspect-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .btn-suspect {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-suspect:hover { background-color: #d35400; }
        
        .result-box {
            display: none;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.6;
        }
        .evidence-summary {
            background-color: rgba(255,255,255,0.7);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
            display: inline-block;
            width: 80%;
        }
        .score-display {
            font-size: 22px;
            color: #c0392b;
            font-weight: bold;
            background: #fadbd8;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 30px;
            margin: 15px 0;
            border: 2px solid #e74c3c;
        }
        .btn-restart {
            margin-top: 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-restart:hover { background-color: #2ecc71; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🔍 理科室の探偵！謎の液体X</h1>
    
    <div class="settings-bar">
        <div>
            <label for="difficulty-select">📊 難易度：</label>
            <select id="difficulty-select" onchange="initGame()">
                <option value="1">初級（3種類：塩酸・炭酸水・食塩水）</option>
                <option value="2">中級（5種類：初級＋アンモニア水・石灰水）</option>
                <option value="3" selected>上級（6種類：すべて）</option>
            </select>
        </div>
        <button class="btn-hint" onclick="showHint()">💡 探偵長にヒントをもらう</button>
    </div>

    <div class="story-box" id="story-text">
        探偵長！ラベルのはがれた「謎の液体X」が見つかりました。<br>
        調査ツールを使って証拠を集め、正体を当ててください！<br>
        <span style="font-size: 0.9em; color: #e74c3c;">※調査は<b>3回まで減点なし！</b>しっかり調べて推理しよう。（4回目以降はスコアが下がるぞ！）</span>
    </div>

    <div class="flex-area">
        <div class="tools-area">
            <h2>🧪 調査ツール</h2>
            <div class="tool-grid">
                <button class="btn-tool" onclick="investigate('appearance', this)">👁️ 見た目を観察する</button>
                <button class="btn-tool" onclick="investigate('smell', this)">👃 においを手であおいで調べる</button>
                <button class="btn-tool" onclick="investigate('litmus', this)">📄 リトマス紙をつける</button>
                <button class="btn-tool" onclick="investigate('btb', this)">🧪 BTB液を入れる</button>
                <button class="btn-tool" onclick="investigate('phenolphthalein', this)">💧 フェノールフタレイン液</button>
                <button class="btn-tool" onclick="investigate('electricity', this)">⚡ 電気を通すか調べる</button>
                <button class="btn-tool" onclick="investigate('metal_al', this)">🔩 アルミニウムを入れる</button>
                <button class="btn-tool" onclick="investigate('metal_fe', this)">🔩 鉄を入れる</button>
                <button class="btn-tool" onclick="investigate('evaporate', this)">🔥 熱して蒸発させる</button>
                <button class="btn-tool" onclick="investigate('limewater', this)">🌫️ 石灰水を混ぜる</button>
            </div>
        </div>

        <div class="log-area">
            <h2>📝 探偵メモ（証拠）</h2>
            <div id="investigation-log">
                <div style="color:#7f8c8d;" id="log-placeholder">まだ調査は行われていません。</div>
            </div>
            <div style="text-align: right; margin-top: 10px; font-weight: bold; color: #e74c3c;">
                現在の調査回数：<span id="investigation-count">0</span>回
            </div>
        </div>
    </div>

    <div class="inference-area" id="inference-area">
        <h2>💡 証拠はそろった！液体Xの正体はどれだ？</h2>
        <div class="suspect-btns" id="suspect-container">
            </div>
    </div>

    <div id="result-area" class="result-box">
        <div id="result-message"></div>
        <button class="btn-restart" onclick="initGame()">もう一度別の謎に挑戦する</button>
    </div>
</div>

<script>
    // ツール名の一覧（証拠まとめ用）
    const toolNames = {
        'appearance': '見た目',
        'smell': 'におい',
        'litmus': 'リトマス紙',
        'btb': 'BTB液',
        'phenolphthalein': 'フェノールフタレイン液',
        'electricity': '電気を通すか',
        'metal_al': 'アルミニウム',
        'metal_fe': '鉄',
        'evaporate': '蒸発',
        'limewater': '石灰水'
    };

    // すべての水溶液のデータ
    const allSolutions = [
        {
            id: "ensan", name: "塩酸", level: 1,
            appearance: "無色とうめいだ。",
            smell: "手であおぐと、つんとしたにおいがする！",
            litmus: "青色のリトマス紙が赤色になった！（酸性）",
            btb: "黄色になった！（酸性）",
            phenolphthalein: "変化なし。（無色）",
            electricity: "豆電球が明るく点灯した！（強く電気を通す）",
            metal_al: "あわを出してとけた！",
            metal_fe: "あわを出してとけた！",
            evaporate: "何も残らない。気体がとけているようだ。",
            limewater: "変化なし。",
            desc: "金属をとかし、つんとしたにおいがするのは「塩酸」の大きな特徴だよ！",
            hint: "【探偵長より】\nBTB液やリトマス紙で「酸性」か確かめてみろ！あと「金属」をとかすのがこいつの大きな特徴だ！"
        },
        {
            id: "tansansui", name: "炭酸水", level: 1,
            appearance: "無色とうめいだが、小さなあわが出ている！",
            smell: "手であおいでかいだが、とくににおいはしない。",
            litmus: "青色のリトマス紙が赤色になった！（酸性）",
            btb: "黄色になった！（酸性）",
            phenolphthalein: "変化なし。（無色）",
            electricity: "豆電球が点灯した！（電気を通す）",
            metal_al: "変化なし。（とけない）",
            metal_fe: "変化なし。（とけない）",
            evaporate: "何も残らない。気体がとけているようだ。",
            limewater: "白くにごった！二酸化炭素がとけている証拠だ！",
            desc: "あわが出ていて、石灰水を白くにごらせるのは「炭酸水」だけだね！",
            hint: "【探偵長より】\n「見た目」をよく観察しろ！それから「石灰水」を混ぜてみると一発でわかるはずだ！"
        },
        {
            id: "shokuensui", name: "食塩水", level: 1,
            appearance: "無色とうめいだ。",
            smell: "手であおいでかいだが、とくににおいはしない。",
            litmus: "どちらのリトマス紙も変化なし。（中性）",
            btb: "緑色になった！（中性）",
            phenolphthalein: "変化なし。（無色）",
            electricity: "豆電球が明るく点灯した！（強く電気を通す）",
            metal_al: "変化なし。（とけない）",
            metal_fe: "変化なし。（とけない）",
            evaporate: "白いものが残った！固体がとけているようだ。",
            limewater: "変化なし。",
            desc: "中性で、においがなく、蒸発させると白いものが残るのは「食塩水」だね！",
            hint: "【探偵長より】\nBTB液が「緑色（中性）」にならないか？あと「蒸発」させると何かが残るはずだ！"
        },
        {
            id: "ammonia", name: "アンモニア水", level: 2,
            appearance: "無色とうめいだ。",
            smell: "手であおぐと、つんとしたにおいがする！",
            litmus: "赤色のリトマス紙が青色になった！（アルカリ性）",
            btb: "青色になった！（アルカリ性）",
            phenolphthalein: "赤色になった！（アルカリ性）",
            electricity: "豆電球が点灯した！（電気を通す）",
            metal_al: "変化なし。（とけない）",
            metal_fe: "変化なし。（とけない）",
            evaporate: "何も残らない。気体がとけているようだ。",
            limewater: "変化なし。",
            desc: "アルカリ性で、つんとしたにおいがして、何も残らないのは「アンモニア水」だよ！",
            hint: "【探偵長より】\n「アルカリ性」の反応が出るはずだ。「におい」をかぐと特徴的だぞ！蒸発させるとどうなるかな？"
        },
        {
            id: "sekkausui", name: "石灰水", level: 2,
            appearance: "無色とうめいだ。",
            smell: "手であおいでかいだが、とくににおいはしない。",
            litmus: "赤色のリトマス紙が青色になった！（アルカリ性）",
            btb: "青色になった！（アルカリ性）",
            phenolphthalein: "赤色になった！（アルカリ性）",
            electricity: "豆電球が少しだけ点灯した！（弱く電気を通す）",
            metal_al: "変化なし。（とけない）",
            metal_fe: "変化なし。（とけない）",
            evaporate: "白いものが残った！固体がとけているようだ。",
            limewater: "変化なし。",
            desc: "においのないアルカリ性で、金属をとかさないのは「石灰水」だね！弱く電気を通すのも特徴だ。",
            hint: "【探偵長より】\n「アルカリ性」だけど、「におい」はない。「電気」の通り方が少し弱い（豆電球が暗い）のが見分けるポイントだ！"
        },
        {
            id: "suisanka", name: "水酸化ナトリウム水溶液", level: 3,
            appearance: "無色とうめいだ。",
            smell: "手であおいでかいだが、とくににおいはしない。",
            litmus: "赤色のリトマス紙が青色になった！（アルカリ性）",
            btb: "青色になった！（アルカリ性）",
            phenolphthalein: "赤色になった！（アルカリ性）",
            electricity: "豆電球が明るく点灯した！（強く電気を通す）",
            metal_al: "あわを出してとけた！",
            metal_fe: "変化なし。（とけない）",
            evaporate: "白いものが残った！固体がとけているようだ。",
            limewater: "変化なし。",
            desc: "アルカリ性で、アルミニウムだけを強力にとかすのは「水酸化ナトリウム水溶液」の特別な性質だよ！",
            hint: "【探偵長より】\n「アルカリ性」で「電気を強く通す」。そして何より、「アルミニウム」だけをとかす強力な液だ！"
        }
    ];

    let activeSolutions = [];
    let targetSolution = null;
    let investigatedTools = [];
    let investigationCount = 0;

    // ヒントを表示する関数
    function showHint() {
        if (!targetSolution) return;
        alert(targetSolution.hint);
    }

    // ゲームの初期化
    function initGame() {
        const diffLevel = parseInt(document.getElementById('difficulty-select').value);
        activeSolutions = allSolutions.filter(sol => sol.level <= diffLevel);

        const randomIndex = Math.floor(Math.random() * activeSolutions.length);
        targetSolution = activeSolutions[randomIndex];
        
        investigatedTools = [];
        investigationCount = 0;

        document.getElementById('investigation-log').innerHTML = '<div style="color:#7f8c8d;" id="log-placeholder">まだ調査は行われていません。</div>';
        document.getElementById('investigation-count').innerText = investigationCount;
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('inference-area').style.display = 'block';

        const toolBtns = document.querySelectorAll('.btn-tool');
        toolBtns.forEach(btn => {
            btn.disabled = false;
        });

        const suspectContainer = document.getElementById('suspect-container');
        suspectContainer.innerHTML = '';
        
        const shuffledSolutions = [...activeSolutions].sort(() => Math.random() - 0.5);
        
        shuffledSolutions.forEach(sol => {
            const btn = document.createElement('button');
            btn.className = 'btn-suspect';
            btn.innerText = sol.name;
            btn.onclick = () => guess(sol.id);
            suspectContainer.appendChild(btn);
        });
    }

    // 調査ツールを使ったときの処理
    function investigate(toolKey, btn) {
        if (investigatedTools.includes(toolKey)) return;

        if (investigatedTools.length === 0) {
            document.getElementById('log-placeholder').style.display = 'none';
        }

        investigatedTools.push(toolKey);
        investigationCount++;
        document.getElementById('investigation-count').innerText = investigationCount;

        btn.disabled = true;

        const resultText = targetSolution[toolKey];
        const logArea = document.getElementById('investigation-log');
        const logHTML = `<div class="log-item">【${toolNames[toolKey]}】<br><span>${resultText}</span></div>`;
        logArea.insertAdjacentHTML('afterbegin', logHTML);
    }

    // 推理（解答）したときの処理
    function guess(guessedId) {
        if (investigatedTools.length === 0) {
            alert("まだ証拠がありません！上のツールから調査をしてから推理しよう！");
            return;
        }

        const resultArea = document.getElementById('result-area');
        const resultMessage = document.getElementById('result-message');
        const inferenceArea = document.getElementById('inference-area');

        inferenceArea.style.display = 'none';
        resultArea.style.display = 'block';

        // スコア計算: 3回までは100点満点。4回目以降、1回につき10点減点。
        let score = 100;
        if (investigationCount > 3) {
            score = 100 - ((investigationCount - 3) * 10);
        }
        if (score < 10) score = 10; 

        if (guessedId === targetSolution.id) {
            let evidence = `<div class="evidence-summary"><strong>【キミが集めた証拠まとめ】</strong><br>`;
            investigatedTools.forEach(tool => {
                evidence += `・${toolNames[tool]}： ${targetSolution[tool]}<br>`;
            });
            evidence += `</div>`;

            resultArea.style.backgroundColor = '#d4edda';
            resultArea.style.color = '#155724';
            resultArea.style.border = '4px solid #c3e6cb';
            
            resultMessage.innerHTML = 
                `🎉 <span style="font-size: 24px;"><b>大正解！</b></span><br><br>
                 液体Xの正体は<b>「${targetSolution.name}」</b>だ！<br><br>
                 <span style="font-size:15px; color:#333;">${targetSolution.desc}</span><br>
                 <div class="score-display">🏅 探偵スコア：${score} 点！</div><br>
                 <b>🔍 調査回数：${investigationCount}回</b><br>
                 ${evidence}`;
        } else {
            const guessedName = activeSolutions.find(s => s.id === guessedId).name;
            resultArea.style.backgroundColor = '#f8d7da';
            resultArea.style.color = '#721c24';
            resultArea.style.border = '4px solid #f5c6cb';
            
            resultMessage.innerHTML = 
                `💦 <span style="font-size: 24px;"><b>残念！間違いだ...</b></span><br><br>
                 キミは「${guessedName}」だと推理したが、証拠と矛盾しているようだ。<br>
                 本当の正体は<b>「${targetSolution.name}」</b>だったよ。<br><br>
                 <span style="font-size:14px; color:#333;">${targetSolution.desc}</span><br>
                 <div class="score-display" style="background:#f2f3f4; border-color:#bdc3c7; color:#7f8c8d;">
                    スコア：0 点... 次は慎重に調査しよう！
                 </div>`;
        }
    }

    // ページ読み込み時にゲームスタート
    window.onload = initGame;
</script>

</body>
</html>
