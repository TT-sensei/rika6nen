<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理科室の探偵！謎の液体Xの正体をあばけ</title>
    <style>
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
            background-color: #2c3e50;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .game-container {
            background-color: #fdfbf7;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 20px;
            border: 4px solid #8e44ad;
        }
        h1 {
            text-align: center;
            color: #8e44ad;
            font-size: 24px;
            border-bottom: 2px dashed #8e44ad;
            padding-bottom: 10px;
        }
        .story-box {
            background-color: #e8f8f5;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #16a085;
            text-align: center;
        }
        .flex-area {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .flex-area { flex-direction: column; }
        }
        .tools-area, .log-area {
            flex: 1;
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
        }
        h2 {
            font-size: 18px;
            color: #2980b9;
            margin-top: 0;
            text-align: center;
        }
        .btn-tool {
            display: block;
            width: 100%;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-tool:hover { background-color: #2980b9; }
        
        #investigation-log {
            height: 250px;
            overflow-y: auto;
            background: white;
            border: 1px solid #bdc3c7;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .log-item { margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        .log-item span { font-weight: bold; color: #e74c3c; }

        .inference-area {
            background-color: #fff3e0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #e67e22;
        }
        .suspect-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .btn-suspect {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-suspect:hover { background-color: #d35400; }
        
        .result-box {
            display: none;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        .btn-restart {
            margin-top: 15px;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-restart:hover { background-color: #2ecc71; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🔍 理科室の探偵！謎の液体X</h1>
    <div class="story-box" id="story-text">
        探偵長！ラベルのはがれた「謎の液体X」が見つかりました。<br>
        調査ツールを使って証拠を集め、正体を当ててください！
    </div>

    <div class="flex-area">
        <div class="tools-area">
            <h2>🧪 調査ツール</h2>
            <button class="btn-tool" onclick="investigate('appearance')">👁️ 見た目を観察する</button>
            <button class="btn-tool" onclick="investigate('smell')">👃 においをかぐ</button>
            <button class="btn-tool" onclick="investigate('litmus')">📄 リトマス紙をつける</button>
            <button class="btn-tool" onclick="investigate('metal_al')">🔩 アルミニウムを入れる</button>
            <button class="btn-tool" onclick="investigate('metal_fe')">🔩 鉄を入れる</button>
            <button class="btn-tool" onclick="investigate('evaporate')">🔥 熱して蒸発させる</button>
            <button class="btn-tool" onclick="investigate('limewater')">💧 石灰水を混ぜる</button>
        </div>

        <div class="log-area">
            <h2>📝 探偵メモ（証拠）</h2>
            <div id="investigation-log">
                <div style="color:#7f8c8d;">まだ調査は行われていません。</div>
            </div>
        </div>
    </div>

    <div class="inference-area" id="inference-area">
        <h2>💡 証拠はそろった！液体Xの正体はどれだ？</h2>
        <div class="suspect-btns" id="suspect-container">
            </div>
    </div>

    <div id="result-area" class="result-box">
        <div id="result-message"></div>
        <button class="btn-restart" onclick="initGame()">もう一度別の謎に挑戦する</button>
    </div>
</div>

<script>
    // 6つの水溶液のデータ（教科書に基づいた設定）
    const solutions = [
        {
            id: "ensan", name: "塩酸",
            appearance: "無色とうめいだ。",
            smell: "つんとしたにおいがする！",
            litmus: "青色のリトマス紙が赤色になった！（酸性だ）",
            metal_al: "あわを出してとけた！",
            metal_fe: "あわを出してとけた！",
            evaporate: "何も残らない。気体がとけているようだ。",
            limewater: "変化なし。",
            desc: "金属をとかし、つんとしたにおいがするのは「塩酸」の大きな特徴だよ！"
        },
        {
            id: "tansansui", name: "炭酸水",
            appearance: "無色とうめいだが、小さなあわが出ている！",
            smell: "とくににおいはしない。",
            litmus: "青色のリトマス紙が赤色になった！（酸性だ）",
            metal_al: "変化なし。（とけない）",
            metal_fe: "変化なし。（とけない）",
            evaporate: "何も残らない。気体がとけているようだ。",
            limewater: "白くにごった！二酸化炭素がとけている証拠だ！",
            desc: "あわが出ていて、石灰水を白くにごらせるのは「炭酸水」だけだね！"
        },
        {
            id: "shokuensui", name: "食塩水",
            appearance: "無色とうめいだ。",
            smell: "とくににおいはしない。",
            litmus: "どちらのリトマス紙も変化なし。（中性だ）",
            metal_al: "変化なし。（とけない）",
            metal_fe: "変化なし。（とけない）",
            evaporate: "白いものが残った！固体がとけているようだ。",
            limewater: "変化なし。",
            desc: "中性で、においがなく、蒸発させると白いものが残るのは「食塩水」だね！"
        },
        {
            id: "ammonia", name: "アンモニア水",
            appearance: "無色とうめいだ。",
            smell: "つんとしたにおいがする！",
            litmus: "赤色のリトマス紙が青色になった！（アルカリ性だ）",
            metal_al: "変化なし。（とけない）",
            metal_fe: "変化なし。（とけない）",
            evaporate: "何も残らない。気体がとけているようだ。",
            limewater: "変化なし。",
            desc: "アルカリ性で、つんとしたにおいがして、何も残らないのは「アンモニア水」だよ！"
        },
        {
            id: "sekkausui", name: "石灰水",
            appearance: "無色とうめいだ。",
            smell: "とくににおいはしない。",
            litmus: "赤色のリトマス紙が青色になった！（アルカリ性だ）",
            metal_al: "変化なし。（とけない）",
            metal_fe: "変化なし。（とけない）",
            evaporate: "白いものが残った！固体がとけているようだ。",
            limewater: "変化なし。",
            desc: "においのないアルカリ性で、金属をとかさないのは「石灰水」だね！（※アルミニウムをとかす水酸化ナトリウム水溶液との違いに注意！）"
        },
        {
            id: "suisanka", name: "水酸化ナトリウム水溶液",
            appearance: "無色とうめいだ。",
            smell: "とくににおいはしない。",
            litmus: "赤色のリトマス紙が青色になった！（アルカリ性だ）",
            metal_al: "あわを出してとけた！",
            metal_fe: "変化なし。（とけない）",
            evaporate: "白いものが残った！固体がとけているようだ。",
            limewater: "変化なし。",
            desc: "アルカリ性で、アルミニウムだけをとかすのは「水酸化ナトリウム水溶液」の特別な性質だよ！"
        }
    ];

    let targetSolution = null;
    let investigatedTools = [];

    // ゲームの初期化（ランダムに答えを選ぶ）
    function initGame() {
        // ランダムにターゲットを1つ決定
        const randomIndex = Math.floor(Math.random() * solutions.length);
        targetSolution = solutions[randomIndex];
        investigatedTools = [];

        // UIのリセット
        document.getElementById('investigation-log').innerHTML = '<div style="color:#7f8c8d;">まだ調査は行われていません。</div>';
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('inference-area').style.display = 'block';

        // 推理ボタンの生成
        const suspectContainer = document.getElementById('suspect-container');
        suspectContainer.innerHTML = '';
        
        // 選択肢の順番をランダムにする
        const shuffledSolutions = [...solutions].sort(() => Math.random() - 0.5);
        
        shuffledSolutions.forEach(sol => {
            const btn = document.createElement('button');
            btn.className = 'btn-suspect';
            btn.innerText = sol.name;
            btn.onclick = () => guess(sol.id);
            suspectContainer.appendChild(btn);
        });
    }

    // 調査ツールを使ったときの処理
    function investigate(toolKey) {
        const logArea = document.getElementById('investigation-log');
        
        // 初めての調査のとき、プレースホルダーを消す
        if (investigatedTools.length === 0) {
            logArea.innerHTML = '';
        }

        // すでに同じ調査をしていたら無視する
        if (investigatedTools.includes(toolKey)) {
            return;
        }

        investigatedTools.push(toolKey);
        const resultText = targetSolution[toolKey];
        
        // 調査名を表示用に変換
        const toolNames = {
            'appearance': '👁️ 見た目',
            'smell': '👃 におい',
            'litmus': '📄 リトマス紙',
            'metal_al': '🔩 アルミニウム',
            'metal_fe': '🔩 鉄',
            'evaporate': '🔥 蒸発',
            'limewater': '💧 石灰水'
        };

        const logHTML = `<div class="log-item">【${toolNames[toolKey]}】<br><span>${resultText}</span></div>`;
        logArea.insertAdjacentHTML('afterbegin', logHTML);
    }

    // 推理（解答）したときの処理
    function guess(guessedId) {
        const resultArea = document.getElementById('result-area');
        const resultMessage = document.getElementById('result-message');
        const inferenceArea = document.getElementById('inference-area');

        inferenceArea.style.display = 'none'; // 解答ボタンを隠す
        resultArea.style.display = 'block';   // 結果エリアを表示

        if (guessedId === targetSolution.id) {
            // 正解
            resultArea.style.backgroundColor = '#d4edda';
            resultArea.style.color = '#155724';
            resultArea.style.border = '2px solid #c3e6cb';
            resultMessage.innerHTML = `🎉 <b>大正解！</b><br><br>液体Xの正体は「${targetSolution.name}」だ！<br><span style="font-size:14px; color:#333;">${targetSolution.desc}</span>`;
        } else {
            // 不正解
            const guessedName = solutions.find(s => s.id === guessedId).name;
            resultArea.style.backgroundColor = '#f8d7da';
            resultArea.style.color = '#721c24';
            resultArea.style.border = '2px solid #f5c6cb';
            resultMessage.innerHTML = `💦 <b>残念！間違いだ...</b><br><br>キミは「${guessedName}」だと推理したが、証拠と矛盾しているようだ。<br>本当の正体は「${targetSolution.name}」だったよ。<br><span style="font-size:14px; color:#333;">${targetSolution.desc}</span>`;
        }
    }

    // ページ読み込み時にゲームスタート
    window.onload = initGame;
</script>

</body>
</html>
