<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7. 月と太陽 - 理科アプリ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .space-box {
            background: #fff; padding: 20px; border-radius: 10px;
            max-width: 700px; margin: 20px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* 宇宙の俯瞰ビュー */
        .universe {
            background: #0f172a; height: 300px; border-radius: 10px;
            position: relative; overflow: hidden; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: center;
            border: 4px solid #333;
        }

        /* 太陽の光の表現 */
        .sun-light {
            position: absolute; right: -50px; top: 0; width: 300px; height: 100%;
            background: linear-gradient(to left, rgba(241, 196, 15, 0.4), transparent);
            pointer-events: none;
        }
        .sun-icon {
            position: absolute; right: 10px; font-size: 60px;
            text-shadow: 0 0 20px #f1c40f;
        }

        /* 地球 */
        .earth {
            font-size: 50px; position: absolute; z-index: 2;
        }

        /* 軌道 */
        .orbit {
            width: 200px; height: 200px; border: 1px dashed rgba(255,255,255,0.3);
            border-radius: 50%; position: absolute;
        }

        /* 宇宙から見た月（常に右側が明るい） */
        .space-moon {
            width: 30px; height: 30px; border-radius: 50%;
            position: absolute; z-index: 3;
            /* 太陽が右にあるので、常に右半分が黄色、左半分が黒 */
            background: linear-gradient(to right, #1a1a1a 50%, #f1c40f 50%);
            box-shadow: 0 0 5px rgba(255,255,255,0.2);
            transition: transform 0.1s;
        }

        /* コントロールパネル */
        .controls {
            background: #f1f2f6; padding: 20px; border-radius: 10px; margin-bottom: 20px;
        }
        .slider-container { margin: 20px 0; }
        input[type="range"] {
            width: 100%; height: 10px; background: #ddd; border-radius: 5px; outline: none;
            accent-color: #3498db;
        }

        /* 地球からの見え方ビュー */
        .earth-view {
            background: #2c3e50; color: white; padding: 20px; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center;
        }
        .moon-phase { font-size: 80px; margin: 10px 0; }
        .phase-name { font-size: 1.5rem; font-weight: bold; color: #f1c40f; }

    </style>
</head>
<body>
    <header>
        <h1 style="color:white;">🌕 7. 月と太陽</h1>
        <p>月が地球の周りを回ると、形がどう変わって見えるか確かめよう！</p>
    </header>

    <main>
        <div class="space-box">
            
            <div style="font-weight: bold; margin-bottom: 10px;">👇 宇宙から見た図（太陽の光は常に右から）</div>
            
            <div class="universe">
                <div class="sun-light"></div>
                <div class="sun-icon">☀️</div>
                <div class="orbit"></div>
                <div class="earth">🌍</div>
                <div class="space-moon" id="space-moon"></div>
            </div>

            <div class="controls">
                <h3 style="margin-top: 0;">月が地球を回る日数を進めよう</h3>
                <div class="slider-container">
                    <input type="range" id="day-slider" min="0" max="28" value="0" oninput="updateMoon()">
                </div>
                <div style="font-size: 1.2rem; font-weight: bold;">
                    経過日数: <span id="day-display" style="color: #e74c3c;">0</span> 日目
                </div>
            </div>

            <div class="earth-view">
                <div>👀 地球から空を見上げると…？</div>
                <div class="moon-phase" id="earth-moon">🌑</div>
                <div class="phase-name" id="phase-name">新月（しんげつ）</div>
                <p id="explanation" style="font-size: 0.9rem; margin-top: 10px;">地球から見ると、太陽の光が当たっている部分が全く見えないよ。</p>
            </div>

            <div style="margin-top: 20px; text-align: left;">
                <a href="index.html" style="color: #4CAF50; text-decoration: none; font-weight:bold;">← メニューに戻る</a>
            </div>
        </div>
    </main>

    <script>
        const slider = document.getElementById('day-slider');
        const dayDisplay = document.getElementById('day-display');
        const spaceMoon = document.getElementById('space-moon');
        const earthMoon = document.getElementById('earth-moon');
        const phaseName = document.getElementById('phase-name');
        const explanation = document.getElementById('explanation');

        // 月の満ち欠けデータ（絵文字と解説）
        const phases = [
            { day: 0, emoji: '🌑', name: '新月（しんげつ）', desc: '太陽の光が当たっている部分が、地球からは全く見えない状態。' },
            { day: 4, emoji: '🌒', name: '三日月（みかづき）', desc: '右側が少しだけ光って見える。夕方の西の空に見えるよ。' },
            { day: 7, emoji: '🌓', name: '上弦の月（半月）', desc: '右半分が光って見える半月。地球から見て、月が太陽と90度の位置にきたよ。' },
            { day: 11, emoji: '🌔', name: '十三夜', desc: '満月に向かって、どんどん丸くなってきた状態。' },
            { day: 14, emoji: '🌕', name: '満月（まんげつ）', desc: '太陽の光が当たっている部分がすべて地球を向いている！' },
            { day: 18, emoji: '🌖', name: '寝待月', desc: '満月を過ぎて、今度は右側から欠け始めた状態。' },
            { day: 21, emoji: '🌗', name: '下弦の月（半月）', desc: '左半分が光って見える半月。夜中から朝方にかけて空に見えるよ。' },
            { day: 25, emoji: '🌘', name: '二十六夜', desc: '左側が細く光って見える。もうすぐまた新月に戻るよ。' },
            { day: 28, emoji: '🌑', name: '新月（しんげつ）', desc: '約1ヶ月（約29.5日）かけて、元の位置に戻ってきた！' }
        ];

        function updateMoon() {
            const day = parseInt(slider.value);
            dayDisplay.innerText = day;

            // 1. 宇宙ビューでの月の位置を計算（円運動）
            // 0日のとき右側（太陽側）に配置。角度を計算。
            // 28日で1周（360度）と仮定。数学的に0度は右側。
            // 回転を反時計回り（上→左→下→右）にするために角度を調整
            const angle = (day / 28) * 360; 
            const radius = 100; // 軌道の半径

            // Math.cosとMath.sinでXY座標を計算（角度はラジアンに変換）
            // ※0度が右（太陽側）になるように計算
            const radian = angle * (Math.PI / 180);
            const x = Math.cos(radian) * radius;
            const y = Math.sin(radian) * radius * -1; // Y軸は上がマイナスなので反転

            // 月を中心（地球）からX, Yの距離だけずらす
            spaceMoon.style.transform = `translate(${x}px, ${y}px)`;

            // 2. 地球からの見え方（絵文字）を更新
            // 現在の日数に一番近い月相データを探す
            let currentPhase = phases[0];
            for (let i = phases.length - 1; i >= 0; i--) {
                if (day >= phases[i].day) {
                    currentPhase = phases[i];
                    break;
                }
            }

            earthMoon.innerText = currentPhase.emoji;
            phaseName.innerText = currentPhase.name;
            explanation.innerText = currentPhase.desc;
        }

        // 初期表示をセット
        updateMoon();
    </script>
</body>
</html>
