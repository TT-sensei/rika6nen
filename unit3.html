<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3. 人や動物の体 - 理科アプリ</title>
    <style>
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
            background-color: #ffe4e1; /* 体の中っぽい薄いピンク */
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header { background-color: #e74c3c; color: white; padding: 20px 0; }
        .body-box {
            background: #fff; padding: 20px; border-radius: 10px;
            max-width: 600px; margin: 20px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .organs-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;
        }
        .organ {
            background: #fdf5e6; padding: 15px; border-radius: 10px; border: 2px solid #ccc;
        }
        .organ-icon { font-size: 40px; margin-bottom: 10px; }
        .heart-area {
            grid-column: span 2; background: #ffcccb; border-color: #ff9999;
        }
        .cell-area {
            grid-column: span 2; background: #e0ffff; border-color: #afeeee; margin-top: 10px;
        }
        button {
            padding: 10px 15px; font-size: 1rem; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer; transition: 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-breathe { background: #87cefa; color: #333; }
        .btn-eat { background: #f4a460; color: #fff; }
        .btn-pump { background: #e74c3c; color: #fff; font-size: 1.2rem; padding: 15px; width: 80%; }
        
        .status { font-weight: bold; font-size: 1.2rem; margin-top: 10px; }
        .energy-bar {
            width: 100%; height: 30px; background: #ddd; border-radius: 15px; overflow: hidden; margin-top: 10px;
        }
        .energy-fill {
            height: 100%; background: #2ecc71; width: 50%; transition: width 0.3s;
        }
        .alert { color: red; font-weight: bold; height: 24px; }
    </style>
</head>
<body>
    <header>
        <h1>🫀 3. 人や動物の体のつくりとはたらき</h1>
        <p>呼吸・消化・血液の連携で、全身にエネルギーを届けよう！</p>
    </header>

    <main>
        <div class="body-box">
            <div id="alert-msg" class="alert"></div>
            
            <div class="organs-grid">
                <div class="organ">
                    <div class="organ-icon">🫁</div>
                    <div>肺（呼吸）</div>
                    <button class="btn-breathe" onclick="breathe()">息を吸う 💨</button>
                    <div class="status" style="color:#2980b9;">酸素: <span id="val-o2">0</span></div>
                </div>

                <div class="organ">
                    <div class="organ-icon">🥪👉🥖</div>
                    <div>胃・腸（消化・吸収）</div>
                    <button class="btn-eat" onclick="eat()">ご飯を食べる 🍙</button>
                    <div class="status" style="color:#d35400;">栄養: <span id="val-nutri">0</span></div>
                </div>

                <div class="organ heart-area">
                    <div class="organ-icon" id="heart-icon">❤️</div>
                    <div>心臓（血液のポンプ）</div>
                    <p>酸素と栄養を血液に乗せて全身へ送る！</p>
                    <button class="btn-pump" onclick="pumpHeart()">ドクン！と送る 🩸</button>
                </div>

                <div class="organ cell-area">
                    <div class="organ-icon">💪</div>
                    <div>全身の細胞</div>
                    <p>酸素と栄養を使って生きるエネルギーを作る！</p>
                    <div>全身のエネルギー残量</div>
                    <div class="energy-bar">
                        <div id="energy-fill" class="energy-fill"></div>
                    </div>
                </div>
            </div>
            
            <div style="margin-top: 20px;">
                <a href="index.html" style="color: #e74c3c; text-decoration: none; font-weight:bold;">← メニューに戻る</a>
            </div>
        </div>
    </main>

    <script>
        // 体内の状態データ
        let oxygen = 0;    // 肺にある酸素
        let nutrients = 0; // 腸にある栄養
        let energy = 50;   // 全身のエネルギー（0〜100）

        const o2Display = document.getElementById('val-o2');
        const nutriDisplay = document.getElementById('val-nutri');
        const energyFill = document.getElementById('energy-fill');
        const alertMsg = document.getElementById('alert-msg');
        const heartIcon = document.getElementById('heart-icon');

        // 息を吸う
        function breathe() {
            if (oxygen < 10) oxygen += 3;
            if (oxygen > 10) oxygen = 10;
            updateDisplay();
        }

        // ご飯を食べる
        function eat() {
            if (nutrients < 10) nutrients += 3;
            if (nutrients > 10) nutrients = 10;
            updateDisplay();
        }

        // 心臓を動かす（ここが連携のポイント！）
        function pumpHeart() {
            // 心臓のアニメーション
            heartIcon.style.transform = "scale(1.3)";
            setTimeout(() => { heartIcon.style.transform = "scale(1)"; }, 150);

            // 酸素と栄養が両方ある時だけエネルギーが作れる
            if (oxygen >= 1 && nutrients >= 1) {
                oxygen -= 1;
                nutrients -= 1;
                energy += 10;
                if (energy > 100) energy = 100;
                alertMsg.innerText = "全身に酸素と栄養が届いた！✨";
                alertMsg.style.color = "green";
            } else {
                alertMsg.innerText = "⚠️ 酸素か栄養が足りない！";
                alertMsg.style.color = "red";
            }
            updateDisplay();
        }

        // 生命維持（常にエネルギーを消費する）
        function consumeEnergy() {
            energy -= 2;
            if (energy <= 0) {
                energy = 0;
                alertMsg.innerText = "💀 エネルギー切れ！早く呼吸して食べて！";
                alertMsg.style.color = "red";
            }
            updateDisplay();
        }

        // 画面の更新
        function updateDisplay() {
            o2Display.innerText = oxygen;
            nutriDisplay.innerText = nutrients;
            energyFill.style.width = energy + "%";
            
            // エネルギー残量で色を変える
            if (energy > 50) energyFill.style.background = "#2ecc71"; // 緑
            else if (energy > 20) energyFill.style.background = "#f1c40f"; // 黄
            else energyFill.style.background = "#e74c3c"; // 赤
        }

        // 1秒に1回エネルギーが減る（基礎代謝の表現）
        setInterval(consumeEnergy, 1000);
        updateDisplay();
    </script>
</body>
</html>
