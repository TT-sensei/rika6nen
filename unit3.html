<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ミクロ探検隊！からだのふしぎツアー 究極特訓編</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap');

        body {
            font-family: 'Yusei Magic', sans-serif;
            background-color: #e0f7fa;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            background-color: #fff;
            width: 90%;
            max-width: 600px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1, h2, h3 {
            color: #00838f;
        }

        .screen {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 15px 20px;
            margin: 10px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #e65100;
            transition: all 0.1s;
            font-family: 'Yusei Magic', sans-serif;
            width: 80%;
            max-width: 300px;
            touch-action: manipulation;
        }

        .btn:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: none;
        }

        .btn-option {
            background-color: #4caf50;
            box-shadow: 0 5px 0 #2e7d32;
        }

        .btn-review {
            background-color: #e91e63;
            box-shadow: 0 5px 0 #880e4f;
        }

        #status-bar {
            display: flex;
            justify-content: space-between;
            background-color: #00acc1;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .stage-card {
            background-color: #f1f8e9;
            border: 2px solid #8bc34a;
            border-radius: 10px;
            padding: 15px;
            margin: 10px auto;
            cursor: pointer;
            transition: transform 0.2s;
            width: 80%;
            touch-action: manipulation;
        }

        .stage-card:hover {
            transform: scale(1.03);
            background-color: #dcedc8;
        }

        .stage-card.cleared {
            background-color: #e0f2f1;
            border-color: #00897b;
        }

        #explanation {
            background-color: #fff9c4;
            border: 2px dashed #fbc02d;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
            display: none;
        }

        .character {
            font-size: 50px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-bar" style="display: none;">
        <div>🧪 Pt: <span id="score-display">0</span></div>
        <div id="current-area-display">エリア: 未定</div>
    </div>

    <div id="screen-title" class="screen active">
        <div class="character">🚁🔬</div>
        <h1>ミクロ探検隊！<br>からだのふしぎツアー</h1>
        <p>毎回問題が変わるぞ！<br>体のすみずみまで探検して、すべてのミッションをクリアしよう！</p>
        <button class="btn" onclick="startGame()">探検スタート！</button>
    </div>

    <div id="screen-map" class="screen">
        <h2>🗺️ 体内マップ</h2>
        <p>探検するエリアを選んでね。</p>
        <div id="stage-list"></div>
        
        <div id="review-area" style="margin-top: 20px; display: none;">
            <p style="color: #d32f2f; font-weight: bold;">⚠️ 未解決のミッションがあります！</p>
            <button class="btn btn-review" onclick="startReview()">🔥 弱点克服モードへ</button>
        </div>
        <div id="result-area" style="margin-top: 20px; display: none;">
            <button class="btn" onclick="showFinalResult()">🏆 最終結果を見る</button>
        </div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="character" id="quiz-icon">🤔</div>
        <h2 id="question-text">問題文</h2>
        <div id="options-container"></div>
        
        <div id="explanation">
            <h3 id="result-title"></h3>
            <p id="explanation-text"></p>
            <button class="btn" id="next-btn" onclick="nextQuestion()">次へ進む</button>
        </div>
    </div>

    <div id="screen-ending" class="screen">
        <div class="character">🎉🏆</div>
        <h1>全ミッション完了！</h1>
        <h2>最終ポイント: <span id="final-score">0</span> / <span id="max-score-display">0</span> Pt</h2>
        <p id="evaluation-message"></p>
        <button class="btn" onclick="location.reload()">もう一度最初から遊ぶ</button>
    </div>
</div>

<script>
    const correctSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');
    const wrongSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3');
    correctSound.volume = 0.5;
    wrongSound.volume = 0.5;

    const stages = [
        {
            id: 'shoka', name: '🍖 消化の洞窟', icon: '👄', cleared: false,
            questions: [
                { q: '口からこう門までの、食べ物の通り道のことを何という？', options: ['血管', '気管', '消化管'], ans: 2, exp: '口→食道→胃→小腸→大腸→こう門までの長い一本の道を「消化管」というよ。' },
                { q: 'だ液には、でんぷんをどうするはたらきがある？', options: ['吸収されやすい養分に変える', 'そのまま固くする', '水分に変える'], ans: 0, exp: 'だ液などの「消化液」は、食べ物を体に吸収されやすい別の養分に変えるはたらきがあるんだ。' },
                { q: '胃から出る消化液を何という？', options: ['だ液', '胃液', 'すい液'], ans: 1, exp: '胃からは「胃液」が出て、食べ物をさらにドロドロに消化するよ。' },
                { q: '消化された養分が、おもに吸収される場所はどこ？', options: ['胃', '小腸', '大腸'], ans: 1, exp: '養分のほとんどは「小腸」で吸収されるよ。吸収されなかった水分は、そのあとの「大腸」で吸収されるんだ。' }
            ]
        },
        {
            id: 'kokyu', name: '💨 呼吸の森', icon: '🫁', cleared: false,
            questions: [
                { q: 'はいた空気を石灰水に入れると、どうなる？', options: ['赤くなる', '白くにごる', '変化しない'], ans: 1, exp: 'はいた空気には「二酸化炭素」が多く含まれているから、石灰水が白くにごるんだ。' },
                { q: '吸う空気と比べて、はいた空気の「酸素」の割合はどうなる？', options: ['増える', '変わらない', '減る'], ans: 2, exp: '体の中で酸素が使われるため、はいた空気の中の酸素の割合は「減る」んだよ。' },
                { q: '空気中の酸素を血液にとり入れ、二酸化炭素を出す臓器は？', options: ['心臓', '胃', '肺'], ans: 2, exp: '口や鼻から吸った空気は気管を通って「肺」に入り、そこで血液とガスの交換をするんだ。' },
                { q: 'メダカなどの魚は、どこで呼吸をしている？', options: ['えら', '肺', 'ひれ'], ans: 0, exp: '魚は「えら」を使って、水にとけている酸素をとり入れ、二酸化炭素を出しているよ。' }
            ]
        },
        {
            id: 'junkan', name: '🩸 血液の川', icon: '❤️', cleared: false,
            questions: [
                { q: '血液を全身に送り出すポンプの役割をしているのは？', options: ['肺', '心臓', 'かん臓'], ans: 1, exp: '「心臓」が縮んだりゆるんだりすることで、血液が血管を通って全身をめぐるんだ。' },
                { q: '1分間の心臓の「はく動」の数と、手首で調べる「脈はく」の数はどうなっている？', options: ['はく動が多い', '同じ数', '脈はくが多い'], ans: 1, exp: '心臓のはく動のリズムが血管に伝わったものが脈はくだから、回数は「同じ」になるんだ。' },
                { q: '血液は、体のどこで「酸素」を受けとる？', options: ['小腸', '心臓', '肺'], ans: 2, exp: '血液は「肺」で酸素を受けとり、それを全身のすみずみまで運ぶんだ。' },
                { q: '血液は、体のどこで「養分」を受けとる？', options: ['小腸', '大腸', 'じん臓'], ans: 0, exp: '消化管で消化された養分や水分は、「小腸」で吸収されて血液にとり入れられるよ。' }
            ]
        },
        {
            id: 'zouki', name: '🏭 臓器の基地', icon: '🧠', cleared: false,
            questions: [
                { q: '血液から不要なものをこしとって、尿（にょう）をつくる臓器は？', options: ['じん臓', 'かん臓', 'ぼうこう'], ans: 0, exp: '腰のあたりに２つある「じん臓」が、血液をきれいにするフィルターの役割をしているよ。' },
                { q: 'じん臓でつくられた尿（にょう）は、どこに送られてたまる？', options: ['胃', 'ぼうこう', '大腸'], ans: 1, exp: 'じん臓でこしとられた不要なものは尿となり、「ぼうこう」に送られて一時的にたまるんだ。' },
                { q: '養分を一時的にたくわえたり、消化に関係する液を作ったりする臓器は？', options: ['肺', 'じん臓', 'かん臓'], ans: 2, exp: '「かん臓」は、おなかの上の方（右側）にある大きな臓器で、養分をたくわえたりする重要な働きがあるよ。' },
                { q: 'メダカの尾びれを顕微鏡で見ると、何が流れているのが見える？', options: ['だ液', '血液', '空気'], ans: 1, exp: 'メダカの尾びれなどのすき通った部分を観察すると、細い血管の中を「血液」が流れているのが見えるよ。' }
            ]
        }
    ];

    let score = 0;
    let maxScore = 0;
    let currentQuestions = [];
    let currentStageName = "";
    let currentStageIcon = "";
    let currentQuestionIndex = 0;
    let wrongQuestions = [];
    let isReviewMode = false;
    let isAnswering = false;

    // ★追加機能：配列をランダムに並び替える関数（フィッシャー・イェーツのシャッフル）
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startGame() {
        score = 0;
        wrongQuestions = [];
        maxScore = stages.reduce((sum, stage) => sum + stage.questions.length, 0) * 10;
        updateScore();
        document.getElementById('status-bar').style.display = 'flex';
        renderMap();
        showScreen('screen-map');
    }

    function renderMap() {
        const stageList = document.getElementById('stage-list');
        stageList.innerHTML = '';
        let allCleared = true;

        stages.forEach((stage, index) => {
            const div = document.createElement('div');
            div.className = `stage-card ${stage.cleared ? 'cleared' : ''}`;
            div.innerHTML = `<h3>${stage.name}</h3><p>${stage.cleared ? '🔁 もう一度特訓する' : '👉 タップして特訓開始！'}</p>`;
            div.onclick = () => startStage(index);
            stageList.appendChild(div);
            if (!stage.cleared) allCleared = false;
        });

        document.getElementById('review-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'none';

        if (allCleared) {
            if (wrongQuestions.length > 0) {
                document.getElementById('review-area').style.display = 'block';
            } else {
                document.getElementById('result-area').style.display = 'block';
            }
        }
    }

    function startStage(index) {
        isReviewMode = false;
        const stage = stages[index];
        currentStageName = stage.name;
        currentStageIcon = stage.icon;
        
        // ★変更：問題の順番をシャッフルしてセットする
        currentQuestions = shuffleArray([...stage.questions]);
        currentQuestionIndex = 0;
        
        document.getElementById('current-area-display').innerText = `エリア: ${currentStageName}`;
        showQuestion();
        showScreen('screen-quiz');
    }

    function startReview() {
        isReviewMode = true;
        currentStageName = "🔥 弱点克服モード";
        currentStageIcon = "💪";
        
        // ★変更：間違えた問題の順番もシャッフルする
        currentQuestions = shuffleArray([...wrongQuestions]); 
        wrongQuestions = [];
        currentQuestionIndex = 0;
        
        document.getElementById('current-area-display').innerText = `エリア: 弱点克服`;
        showQuestion();
        showScreen('screen-quiz');
    }

    function showQuestion() {
        isAnswering = false;
        const qData = currentQuestions[currentQuestionIndex];
        
        document.getElementById('quiz-icon').innerText = currentStageIcon;
        // 何問目か（1/4 のような形式に変更）
        document.getElementById('question-text').innerText = `Q${currentQuestionIndex + 1}/${currentQuestions.length}: ${qData.q}`;
        document.getElementById('explanation').style.display = 'none';
        document.getElementById('options-container').style.display = 'block';

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        // ★変更：選択肢をシャッフルする処理
        // 元の答えのインデックス（番号）を保持したまま配列を作る
        let optionsWithIndex = qData.options.map((opt, index) => {
            return { text: opt, originalIndex: index };
        });

        // 選択肢の配列をシャッフル
        optionsWithIndex = shuffleArray(optionsWithIndex);

        // シャッフルされた選択肢でボタンを生成
        optionsWithIndex.forEach((optObj) => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-option';
            btn.innerText = optObj.text;
            // 回答チェック時には、シャッフル前の元のインデックスを渡す
            btn.onclick = () => checkAnswer(optObj.originalIndex);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedOriginalIndex) {
        if (isAnswering) return;
        isAnswering = true;

        const qData = currentQuestions[currentQuestionIndex];
        
        // 元のインデックスと正解のインデックスを比較する
        const isCorrect = (selectedOriginalIndex === qData.ans);
        
        document.getElementById('options-container').style.display = 'none';
        const expDiv = document.getElementById('explanation');
        expDiv.style.display = 'block';

        if (isCorrect) {
            correctSound.currentTime = 0;
            correctSound.play().catch(e => console.log("音の再生がブロックされました"));
            document.getElementById('result-title').innerHTML = '⭕ 大正解！';
            document.getElementById('result-title').style.color = '#2e7d32';
            
            if (!isReviewMode) {
                score += 10;
                updateScore();
            }
        } else {
            wrongSound.currentTime = 0;
            wrongSound.play().catch(e => console.log("音の再生がブロックされました"));
            document.getElementById('result-title').innerHTML = '❌ おしい！';
            document.getElementById('result-title').style.color = '#c62828';

            if (!wrongQuestions.some(q => q.q === qData.q)) {
                wrongQuestions.push(qData);
            }
        }

        document.getElementById('explanation-text').innerText = qData.exp;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuestions.length) {
            showQuestion();
        } else {
            if (!isReviewMode) {
                const stageIndex = stages.findIndex(s => s.name === currentStageName);
                if(stageIndex !== -1) stages[stageIndex].cleared = true;
                alert(`${currentStageName} の調査が完了した！`);
            } else {
                alert(`弱点克服モード終了！`);
            }
            document.getElementById('current-area-display').innerText = `エリア: マップ`;
            renderMap();
            showScreen('screen-map');
        }
    }

    function updateScore() {
        document.getElementById('score-display').innerText = score;
    }

    function showFinalResult() {
        document.getElementById('status-bar').style.display = 'none';
        const finalCalculatedScore = maxScore - (wrongQuestions.length * 10);
        document.getElementById('final-score').innerText = finalCalculatedScore;
        document.getElementById('max-score-display').innerText = maxScore;
        
        let msg = '';
        if (wrongQuestions.length === 0) {
            msg = 'パーフェクト！！キミは完璧な人体博士だ！テストもバッチリ！';
        } else {
            msg = '最後までがんばったね！もう一度最初から遊んでパーフェクトを目指そう！';
        }
        
        document.getElementById('evaluation-message').innerText = msg;
        showScreen('screen-ending');
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

</script>
</body>
</html>
