<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. 植物のつくりとはたらき - 理科アプリ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .factory-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .sky {
            height: 100px;
            background: #87CEEB; /* 昼の空 */
            border-radius: 10px 10px 0 0;
            position: relative;
            transition: background 0.5s;
        }
        .sky.night {
            background: #2c3e50; /* 夜の空 */
        }
        .sun {
            font-size: 60px;
            position: absolute;
            top: 10px;
            right: 20px;
            transition: opacity 0.5s;
        }
        .sky.night .sun {
            opacity: 0.2; /* 夜は太陽が見えなくなる */
        }
        .plant-area {
            font-size: 100px;
            margin: 20px 0;
        }
        .dashboard {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .resource {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .controls button {
            padding: 15px 10px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        #btn-sun { background: #f1c40f; color: #333; }
        #btn-water { background: #3498db; color: #fff; }
        #btn-co2 { background: #95a5a6; color: #fff; }
        .controls button:active { transform: scale(0.95); }
        
        .result-box {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>
    <header>
        <h1>🌿 2. 植物のつくりとはたらき</h1>
        <p>光合成をして、栄養（でんぷん）を作り出そう！</p>
    </header>

    <main>
        <div class="factory-box">
            <div id="sky" class="sky">
                <div class="sun">☀️</div>
            </div>
            <div class="plant-area" id="plant">
                🌱
            </div>

            <div class="dashboard">
                <div class="resource" style="color:#3498db;">水(根から): <span id="val-water">0</span></div>
                <div class="resource" style="color:#7f8c8d;">二酸化炭素(気孔から): <span id="val-co2">0</span></div>
            </div>

            <div class="controls">
                <button id="btn-sun" onclick="toggleSun()">昼 / 夜 切り替え</button>
                <button id="btn-water" onclick="addWater()">根から水を吸う💧</button>
                <button id="btn-co2" onclick="addCO2()">気孔からCO₂を吸う💨</button>
            </div>

            <div class="result-box">
                作ったでんぷん🍙: <span id="val-starch">0</span><br>
                出した酸素🫧: <span id="val-o2">0</span>
            </div>
        </div>
    </main>

    <script>
        // 状態の管理
        let isDaytime = true;
        let water = 0;
        let co2 = 0;
        let starch = 0;
        let oxygen = 0;

        const skyElement = document.getElementById('sky');
        const plantElement = document.getElementById('plant');
        const waterDisplay = document.getElementById('val-water');
        const co2Display = document.getElementById('val-co2');
        const starchDisplay = document.getElementById('val-starch');
        const o2Display = document.getElementById('val-o2');

        // 昼と夜を切り替える
        function toggleSun() {
            isDaytime = !isDaytime;
            if (isDaytime) {
                skyElement.classList.remove('night');
            } else {
                skyElement.classList.add('night');
            }
        }

        // 水を追加
        function addWater() {
            if (water < 10) {
                water += 2;
                updateDisplay();
            }
        }

        // 二酸化炭素を追加
        function addCO2() {
            if (co2 < 10) {
                co2 += 2;
                updateDisplay();
            }
        }

        // 光合成の判定（1秒ごとにチェック）
        function checkPhotosynthesis() {
            // 条件：昼間（日光がある） かつ 水がある かつ 二酸化炭素がある
            if (isDaytime && water > 0 && co2 > 0) {
                // 材料を消費して、でんぷんと酸素を作る
                water -= 1;
                co2 -= 1;
                starch += 1;
                oxygen += 1;
                
                // 植物が喜ぶアニメーション（文字を一瞬大きくする）
                plantElement.style.transform = "scale(1.2)";
                setTimeout(() => {
                    plantElement.style.transform = "scale(1)";
                }, 200);
            }
            updateDisplay();
        }

        // 画面の数字を更新
        function updateDisplay() {
            waterDisplay.innerText = water;
            co2Display.innerText = co2;
            starchDisplay.innerText = starch;
            o2Display.innerText = oxygen;
            
            // でんぷんが増えたら植物が成長する表現
            if (starch > 10) plantElement.innerText = "🌿";
            if (starch > 30) plantElement.innerText = "🌳";
        }

        // 1秒に1回、光合成できるかチェックする
        setInterval(checkPhotosynthesis, 1000);
    </script>
</body>
</html>
