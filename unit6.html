<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6. 電気の利用 - 理科アプリ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .factory-box {
            background: #fff; padding: 20px; border-radius: 10px;
            max-width: 700px; margin: 20px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        /* 発電と蓄電エリア */
        .power-station {
            background: #e1f5fe; padding: 20px; border-radius: 10px; margin-bottom: 20px;
            display: flex; flex-direction: column; align-items: center; border: 2px solid #81d4fa;
        }
        .crank-btn {
            background: #ff9800; color: white; font-size: 1.2rem; font-weight: bold;
            padding: 15px 30px; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 4px 0 #e65100; transition: 0.1s; margin-bottom: 15px;
        }
        .crank-btn:active { transform: translateY(4px); box-shadow: none; }
        
        .capacitor {
            width: 80%; background: #ddd; height: 30px; border-radius: 15px;
            overflow: hidden; position: relative; border: 2px solid #555;
        }
        .capacitor-fill {
            height: 100%; width: 0%; background: #4caf50; transition: width 0.2s;
        }
        .capacitor-text {
            position: absolute; width: 100%; text-align: center; top: 5px;
            font-weight: bold; font-size: 0.9rem; color: #333;
        }

        /* 変換装置エリア */
        .devices-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }
        .device-card {
            background: #f5f6fa; border: 2px solid #dcdde1; border-radius: 10px;
            padding: 15px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .device-card.active { border-color: #e74c3c; background: #ffeaa7; }
        
        .device-icon { font-size: 50px; margin-bottom: 10px; transition: 0.2s; }
        .conversion-type {
            font-size: 0.8rem; background: #34495e; color: white;
            padding: 3px 8px; border-radius: 10px; display: inline-block; margin-bottom: 10px;
        }

        /* 動作アニメーション */
        .anim-light { text-shadow: 0 0 20px #f1c40f; transform: scale(1.1); }
        .anim-motion { animation: spin 1s linear infinite; }
        .anim-sound { animation: vibrate 0.1s linear infinite; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes vibrate {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, -2px); }
        }
    </style>
</head>
<body>
    <header>
        <h1 style="color:white;">💡 6. 電気の利用</h1>
        <p>電気を作ってためて、別のエネルギーに変えよう！</p>
    </header>

    <main>
        <div class="factory-box">
            
            <div class="power-station">
                <button class="crank-btn" onclick="crank()">⚡ 手回し発電機を回す！</button>
                <div style="font-weight: bold; margin-bottom: 5px;">コンデンサー（ためた電気）</div>
                <div class="capacitor">
                    <div class="capacitor-fill" id="cap-fill"></div>
                    <div class="capacitor-text" id="cap-text">0 / 100</div>
                </div>
            </div>

            <div style="font-weight: bold; margin-bottom: 10px;">どの装置に電気をつなぐ？（タップでON/OFF）</div>

            <div class="devices-grid">
                <div class="device-card" id="card-bulb" onclick="toggleDevice('bulb')">
                    <div class="conversion-type">電気 ➔ 光 ＋ 熱</div>
                    <div class="device-icon" id="icon-bulb">💡</div>
                    <div><strong>豆電球</strong></div>
                    <div style="font-size: 0.8rem; color: #e74c3c;">消費: 大（すぐ電気がなくなる）</div>
                </div>
                <div class="device-card" id="card-led" onclick="toggleDevice('led')">
                    <div class="conversion-type">電気 ➔ 光</div>
                    <div class="device-icon" id="icon-led">🚥</div>
                    <div><strong>発光ダイオード (LED)</strong></div>
                    <div style="font-size: 0.8rem; color: #2ecc71;">消費: 小（長持ちする）</div>
                </div>
                <div class="device-card" id="card-motor" onclick="toggleDevice('motor')">
                    <div class="conversion-type">電気 ➔ 運動</div>
                    <div class="device-icon" id="icon-motor">⚙️</div>
                    <div><strong>モーター</strong></div>
                    <div style="font-size: 0.8rem; color: #f39c12;">消費: 中</div>
                </div>
                <div class="device-card" id="card-buzzer" onclick="toggleDevice('buzzer')">
                    <div class="conversion-type">電気 ➔ 音</div>
                    <div class="device-icon" id="icon-buzzer">🔔</div>
                    <div><strong>電子ブザー</strong></div>
                    <div style="font-size: 0.8rem; color: #f39c12;">消費: 中</div>
                </div>
            </div>

            <div style="margin-top: 20px; text-align: left;">
                <a href="index.html" style="color: #4CAF50; text-decoration: none; font-weight:bold;">← メニューに戻る</a>
            </div>
        </div>
    </main>

    <script>
        let power = 0; // コンデンサーにためた電気（0〜100）
        let activeDevice = null; // 現在ONになっている装置

        // 装置ごとの電気の減る量（豆電球はLEDの5倍消費する設定）
        const deviceCost = {
            'bulb': 5,
            'led': 1,
            'motor': 3,
            'buzzer': 2
        };

        const capFill = document.getElementById('cap-fill');
        const capText = document.getElementById('cap-text');

        // 手回し発電機を回す（1タップで+10）
        function crank() {
            power += 10;
            if (power > 100) power = 100;
            updateDisplay();
        }

        // 装置のスイッチON/OFF
        function toggleDevice(device) {
            // すでにONならOFFにする
            if (activeDevice === device) {
                turnOffAll();
            } else {
                turnOffAll();
                if (power > 0) {
                    activeDevice = device;
                    document.getElementById('card-' + device).classList.add('active');
                    
                    // アニメーションの追加
                    const icon = document.getElementById('icon-' + device);
                    if (device === 'bulb' || device === 'led') icon.classList.add('anim-light');
                    if (device === 'motor') icon.classList.add('anim-motion');
                    if (device === 'buzzer') icon.classList.add('anim-sound');
                } else {
                    alert("電気がからっぽです！手回し発電機を回してください。");
                }
            }
        }

        // すべての装置をOFFにする
        function turnOffAll() {
            activeDevice = null;
            document.querySelectorAll('.device-card').forEach(card => card.classList.remove('active'));
            document.querySelectorAll('.device-icon').forEach(icon => {
                icon.classList.remove('anim-light', 'anim-motion', 'anim-sound');
            });
        }

        // 電気を消費するループ（0.5秒ごとに実行）
        function consumePower() {
            if (activeDevice && power > 0) {
                // 選択中の装置の消費量だけ電気が減る
                power -= deviceCost[activeDevice];
                if (power <= 0) {
                    power = 0;
                    turnOffAll(); // 電気が切れたら自動ストップ
                }
                updateDisplay();
            }
        }

        // メーターの表示更新
        function updateDisplay() {
            capFill.style.width = power + "%";
            capText.innerText = Math.floor(power) + " / 100";
            
            // 色の変更
            if (power > 50) capFill.style.background = "#4caf50";
            else if (power > 20) capFill.style.background = "#f1c40f";
            else capFill.style.background = "#e74c3c";
        }

        setInterval(consumePower, 500);
    </script>
</body>
</html>
