<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163c34">
  <meta name="description" content="小学6年生理科を、知識・実験や観察の準備・考察の3段階で学ぶ教材です。">
  <title>理科ラボ 6｜見えないしくみを、証拠から考える</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#app">学習内容へ移動</a>
  <header class="site-header">
    <button id="homeButton" class="brand" type="button" aria-label="単元一覧へ戻る">
      <span class="brand-mark" aria-hidden="true">6</span>
      <span><b>理科ラボ</b><small>証拠から、しくみを考える</small></span>
    </button>
    <div class="header-actions">
      <button id="reviewButton" class="header-button" type="button">まとめチェック</button>
      <button id="settingsButton" class="icon-button" type="button" aria-label="設定">⚙</button>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <dialog id="settingsDialog" class="settings-dialog">
    <form method="dialog">
      <div class="dialog-head">
        <h2>設定</h2>
        <button class="icon-button" value="cancel" aria-label="閉じる">×</button>
      </div>
      <p>学習記録は、この端末のブラウザ内だけに保存されます。</p>
      <label class="toggle-row">
        <span><b>効果音</b><small>正解・不正解を短い音で知らせます</small></span>
        <input id="soundToggle" type="checkbox" role="switch">
      </label>
      <button id="resetButton" class="danger-button" type="button">学習記録をすべて消す</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="units.js"></script>
  <script src="app.js"></script>
</body>
</html>
