<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炎のマジシャン イグニスの秘密の実験室</title>
    <style>
        body { font-family: 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif; background-color: #1a0b2e; color: #fff; text-align: center; margin: 0; padding: 20px; }
        #game-container { max-width: 600px; margin: 0 auto; background-color: #2d1b4e; border: 4px solid #f39c12; border-radius: 15px; padding: 20px; box-shadow: 0 0 20px #e67e22; position: relative; overflow: hidden; }
        h1, h2, h3 { color: #f1c40f; text-shadow: 2px 2px 4px #000; }
        
        #visual-area { font-size: 60px; height: 100px; margin: 10px 0; display: flex; justify-content: center; align-items: center; gap: 20px; transition: 0.3s; }
        .flame { animation: flicker 0.5s infinite alternate; display: inline-block; }
        @keyframes flicker {
            0% { transform: scale(1) rotate(-5deg); text-shadow: 0 0 10px #ff0000; }
            100% { transform: scale(1.2) rotate(5deg); text-shadow: 0 0 20px #ffaa00; }
        }
        
        .btn {
            display: block; width: 85%; margin: 10px auto; padding: 12px; font-size: 16px; font-weight: bold; color: #fff;
            background: linear-gradient(45deg, #8e44ad, #2980b9); border: 3px solid #fff; border-radius: 8px; cursor: pointer;
            transition: transform 0.1s, background 0.2s, border-color 0.2s;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { transform: none; cursor: not-allowed; }
        
        /* レベル選択ボタン */
        .btn-level1 { background: linear-gradient(45deg, #27ae60, #2ecc71); }
        .btn-level2 { background: linear-gradient(45deg, #f39c12, #f1c40f); color: #000; border-color: #000; }
        .btn-level3 { background: linear-gradient(45deg, #c0392b, #e74c3c); }

        #status-bar { display: flex; justify-content: space-between; background-color: #000; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; color: #f1c40f; font-size: 14px; }
        #combo-display { color: #e74c3c; animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
        
        #timer-bar-container { width: 100%; height: 10px; background-color: #333; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background-color: #2ecc71; transition: width 1s linear, background-color 0.5s; }
        
        #situation-box { background-color: #000; padding: 15px; border-radius: 8px; border: 2px dashed #9b59b6; margin-bottom: 15px; text-align: left; line-height: 1.6; }
        #explanation-box { display: none; padding: 15px; border-radius: 8px; margin-top: 15px; font-weight: bold; color: #fff; text-align: left; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* ボス戦用UI */
        #boss-ui { display: none; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 2px solid #e74c3c; }
        #boss-hp-container { width: 100%; height: 20px; background-color: #333; border-radius: 10px; overflow: hidden; border: 2px solid #fff; }
        #boss-hp { height: 100%; width: 100%; background-color: #c0392b; transition: width 0.3s; }
        .boss-shake { animation: shake 0.5s; }

        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 50% {transform: translateX(5px);} 75% {transform: translateX(-5px);} }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="title-screen">
        <div style="font-size: 80px; margin: 10px 0;">🪄<span class="flame">🔥</span>🎩</div>
        <h1>炎のマジシャン<br>イグニスの秘密の実験室</h1>
        <p>挑む試練（レベル）を選ぶのじゃ！</p>
        <button class="btn btn-level1" onclick="initGame('beginner')">🟢 初級（空気と燃え方）</button>
        <button class="btn btn-level2" onclick="initGame('intermediate')">🟡 中級（3つの気体）</button>
        <button class="btn btn-level3" onclick="initGame('advanced')">🔴 上級（気体検知管とボス戦）</button>
    </div>

    <div id="game-screen" class="hidden">
        <div id="status-bar">
            <span id="stage-display">第1幕</span>
            <span id="combo-display" class="hidden">🔥 0 コンボ!</span>
            <span id="score-display">魔力: 0</span>
        </div>
        
        <div id="timer-bar-container"><div id="timer-bar"></div></div>

        <div id="boss-ui">
            <h3 style="margin:0 0 5px 0; color:#e74c3c;">大魔王 煙スモッグ HP</h3>
            <div id="boss-hp-container"><div id="boss-hp"></div></div>
        </div>

        <h2 id="stage-title">ステージタイトル</h2>
        <div id="visual-area"></div>
        <div id="situation-box"><p id="situation-text"></p></div>
        <h3 id="question-text">問題文</h3>
        
        <div id="choices-container"></div>

        <div id="explanation-box">
            <h3 id="result-mark" style="margin:0 0 10px 0; font-size: 24px; text-align: center;"></h3>
            <p id="explanation-text"></p>
            <button class="btn" id="next-btn" style="background: #2c3e50; margin-top: 15px;" onclick="nextQuestion()">すぐ次へ進む 🪄</button>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <div style="font-size: 80px; margin: 20px 0;">✨🎓✨</div>
        <h1>ショー終了！</h1>
        <h2>最終魔力: <span id="final-score" style="color:#e67e22; font-size:40px;">0</span></h2>
        <h2 id="rank-text">ランク</h2>
        <p id="rank-message"></p>
        <button class="btn" style="background: linear-gradient(45deg, #e67e22, #e74c3c);" onclick="location.reload()">タイトルへ戻る</button>
    </div>
</div>

<script>
    // レベル別クイズデータ（教科書の画像1〜4を元に作成）
    const allQuizData = {
        beginner: [
            { stageTitle: "第1幕：消えない炎", visual: "🫙 <span class='flame'>🔥</span> 💨", situation: "底のないビンに火のついたろうそくを入れ、ねん土で下のすき間を開け、ふたを開けた。", question: "火が燃え続けた理由は？", choices: ["魔法の風が吹いたから", "空気が入れかわったから", "ビンが空気を作ったから"], correctIndex: 1, explanation: "ものが燃え続けるには【たえず空気が入れかわる】必要があるのじゃ！" },
            { stageTitle: "第2幕：火を消す魔法", visual: "🫙 <span class='flame' style='opacity:0.3;'>🔥</span> 🛑", situation: "今度は、ビンの上のふたをピッタリと閉めてみたぞ。", question: "この後、ろうそくの火はどうなる？", choices: ["もっと激しく燃える", "そのまま燃え続ける", "しばらくすると消える"], correctIndex: 2, explanation: "ふたを閉めると空気が入れかわらなくなり、火は消えてしまうんじゃ。" },
            { stageTitle: "第3幕：見えない空気の正体", visual: "🌬️ 🌍 ❓", situation: "我々の周りにある「空気」。実は色々な気体が混ざっておる。", question: "空気の中に【一番多く】含まれている気体は何かな？", choices: ["酸素（さんそ）", "ちっ素（ちっそ）", "二酸化炭素"], correctIndex: 1, explanation: "空気の約78%（約5分の4）は【ちっ素】なんじゃよ！酸素は約21%じゃ。" }
        ],
        intermediate: [
            { stageTitle: "第1幕：激しく燃える気体", visual: "📦 <span class='flame' style='font-size: 80px;'>🔥</span> ✨", situation: "3つの気体（酸素・ちっ素・二酸化炭素）にろうそくを入れたぞ。", question: "物を【激しく燃やす】働きがある気体はどれだ？", choices: ["ちっ素", "二酸化炭素", "酸素"], correctIndex: 2, explanation: "【酸素】だけが、ものを燃やす働きを持っているのじゃ。" },
            { stageTitle: "第2幕：火が消える気体", visual: "📦 💨 ❌", situation: "では、ちっ素と二酸化炭素のビンにろうそくを入れるとどうなる？", question: "火はどうなったかな？", choices: ["激しく燃えた", "すぐに消えた", "色が変わって燃えた"], correctIndex: 1, explanation: "ちっ素も二酸化炭素も、ものを燃やす働きはないため、火はすぐ消えるぞ。" },
            { stageTitle: "第3幕：酸素を作る魔法の薬", visual: "🧪 🥔 ✨", situation: "実験で『酸素』を人工的に作るマジックじゃ！", question: "酸素を作るために混ぜるものはどれだ？", choices: ["石灰水と水", "オキシドールとじゃがいも等", "お酢と重曹（じゅうそう）"], correctIndex: 1, explanation: "オキシドール（薄い過酸化水素水）に、二酸化マンガンや【じゃがいも（の切り口）】を入れると酸素が発生するぞ！" },
            { stageTitle: "第4幕：白くにごる魔法の水", visual: "🫙 🪄 🥛", situation: "ものが燃えた後の空気を集め、『石灰水』を入れて振ってみたぞ。", question: "透明だった石灰水はどうなった？", choices: ["真っ白ににごった", "赤く色が変わった", "透明なまま変わらない"], correctIndex: 0, explanation: "石灰水は【二酸化炭素】が混じると白くにごる性質があるのじゃ！" }
        ],
        advanced: [
            { stageTitle: "第1幕：燃える前と後の空気", visual: "📏 👁️ 💨", situation: "『気体検知管』で調べると、燃える前の酸素は約21%だった。", question: "ものが燃えた後、酸素の割合はどうなった？", choices: ["約21%で変わらない", "約17%に減った", "約30%に増えた"], correctIndex: 1, explanation: "ものが燃えると、空気中の酸素の一部が使われて【減る】のじゃ。" },
            { stageTitle: "第2幕：増えた気体の正体", visual: "📈 💨 ❓", situation: "酸素が減った代わりに、燃える前は0.04%だった「ある気体」が増えたぞ。", question: "増えた気体は何だ？", choices: ["水蒸気", "ちっ素", "二酸化炭素"], correctIndex: 2, explanation: "ものが燃えると酸素が使われ、代わりに【二酸化炭素】ができるのじゃ。" },
            { stageTitle: "最終幕：大魔王 煙スモッグ襲来！", visual: "🐉👿🔥", situation: "ボス「ガハハ！俺を倒したくば、究極の謎を解いてみろ！」", question: "木が燃え続けるために【必要ない】ものはどれだ？", choices: ["たえず入れかわる空気（酸素）", "燃えるもの（木）", "ちっ素"], correctIndex: 2, explanation: "燃焼に必要なのは「燃えるもの」「酸素」「発火点以上の温度」じゃ。ちっ素は関係ないぞ！ボスの撃破じゃ！", isBoss: true }
        ]
    };

    let quizData = [];
    let currentLevel = '';
    let currentQuestionIndex = 0;
    let score = 0;
    let timeLeft = 15;
    let timerInterval;
    let autoNextTimeout;
    let combo = 0;
    let bossHp = 100;

    // 効果音エンジン
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        
        if(type === 'correct') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.setValueAtTime(1046.5, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'bossHit') {
            osc.type = 'square'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }
    }

    const ui = {
        titleScreen: document.getElementById('title-screen'), gameScreen: document.getElementById('game-screen'), resultScreen: document.getElementById('result-screen'),
        stageTitle: document.getElementById('stage-title'), visualArea: document.getElementById('visual-area'), situationText: document.getElementById('situation-text'),
        questionText: document.getElementById('question-text'), choicesContainer: document.getElementById('choices-container'),
        explanationBox: document.getElementById('explanation-box'), explanationText: document.getElementById('explanation-text'), resultMark: document.getElementById('result-mark'),
        nextBtn: document.getElementById('next-btn'), scoreDisplay: document.getElementById('score-display'), stageDisplay: document.getElementById('stage-display'),
        timerBar: document.getElementById('timer-bar'), comboDisplay: document.getElementById('combo-display'),
        bossUi: document.getElementById('boss-ui'), bossHp: document.getElementById('boss-hp')
    };

    function initGame(level) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        currentLevel = level;
        // 順番は固定して学習しやすくする（必要ならシャッフルも可能）
        quizData = [...allQuizData[level]];
        
        ui.titleScreen.classList.add('hidden');
        ui.gameScreen.classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        clearTimeout(autoNextTimeout);
        ui.explanationBox.style.display = 'none';
        ui.choicesContainer.innerHTML = '';
        ui.gameScreen.classList.remove('shake');
        
        const q = quizData[currentQuestionIndex];
        ui.stageDisplay.textContent = `第${currentQuestionIndex + 1}幕 / 全${quizData.length}幕`;
        ui.stageTitle.textContent = q.stageTitle;
        ui.visualArea.innerHTML = q.visual;
        ui.visualArea.style.transform = "scale(0.8)";
        setTimeout(() => ui.visualArea.style.transform = "scale(1)", 100);

        ui.situationText.textContent = q.situation;
        ui.questionText.textContent = q.question;

        // ボス戦UIの表示
        if (q.isBoss) {
            ui.bossUi.style.display = 'block';
            ui.visualArea.classList.add('boss-shake');
        } else {
            ui.bossUi.style.display = 'none';
            ui.visualArea.classList.remove('boss-shake');
        }

        q.choices.forEach((choice, index) => {
            const button = document.createElement('button');
            button.className = 'btn'; button.textContent = choice;
            button.onclick = () => checkAnswer(index);
            ui.choicesContainer.appendChild(button);
        });

        startTimer();
    }

    function startTimer() {
        timeLeft = 15;
        ui.timerBar.style.width = '100%'; ui.timerBar.style.backgroundColor = '#2ecc71';
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            ui.timerBar.style.width = `${(timeLeft / 15) * 100}%`;
            if (timeLeft <= 5) ui.timerBar.style.backgroundColor = '#e74c3c';
            if (timeLeft <= 0) { clearInterval(timerInterval); checkAnswer(-1); }
        }, 1000);
    }

    function animateScore(newScore) {
        let current = score;
        const interval = setInterval(() => {
            current += 15; if (current >= newScore) { current = newScore; clearInterval(interval); }
            ui.scoreDisplay.textContent = `魔力: ${current}`;
        }, 20);
    }

    function checkAnswer(selectedIndex) {
        clearInterval(timerInterval);
        const q = quizData[currentQuestionIndex];
        const buttons = ui.choicesContainer.querySelectorAll('button');

        buttons.forEach((btn, index) => {
            btn.disabled = true;
            btn.style.background = "#7f8c8d"; btn.style.borderColor = "#95a5a6";
            if (index === q.correctIndex) { btn.style.background = "#27ae60"; btn.style.borderColor = "#2ecc71"; }
            if (index === selectedIndex && index !== q.correctIndex) { btn.style.background = "#c0392b"; btn.style.borderColor = "#e74c3c"; }
        });

        if (selectedIndex === q.correctIndex) {
            combo++; ui.comboDisplay.textContent = `🔥 ${combo} コンボ!`; ui.comboDisplay.classList.remove('hidden');
            const points = 100 + (timeLeft * 10) + (combo * 20);
            animateScore(score + points); score += points;
            
            ui.explanationBox.style.backgroundColor = 'rgba(39, 174, 96, 0.2)';
            ui.resultMark.innerHTML = "⭕ 大正解！"; ui.resultMark.style.color = "#2ecc71";
            
            if (q.isBoss) {
                playSound('bossHit');
                ui.bossHp.style.width = '0%'; // ボス撃破！
                ui.visualArea.innerHTML = "💥☠️💥"; // ボスが爆発
            } else {
                playSound('correct');
            }
        } else {
            playSound('wrong');
            combo = 0; ui.comboDisplay.classList.add('hidden'); ui.gameScreen.classList.add('shake');
            ui.explanationBox.style.backgroundColor = 'rgba(192, 57, 43, 0.2)';
            ui.resultMark.innerHTML = selectedIndex === -1 ? "⏰ 時間切れ！" : "❌ むむ、違うぞ！";
            ui.resultMark.style.color = "#e74c3c";
        }

        ui.explanationText.textContent = q.explanation;
        ui.explanationBox.style.display = 'block';

        if (currentQuestionIndex === quizData.length - 1) {
            ui.nextBtn.textContent = "結果を見る 🎓";
        }

        autoNextTimeout = setTimeout(() => { nextQuestion(); }, 4000); // 4秒後に自動遷移
    }

    function nextQuestion() {
        clearTimeout(autoNextTimeout);
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) { loadQuestion(); } 
        else { showResult(); }
    }

    function showResult() {
        ui.gameScreen.classList.add('hidden'); ui.resultScreen.classList.remove('hidden');
        document.getElementById('final-score').textContent = score;

        const rankText = document.getElementById('rank-text');
        const rankMessage = document.getElementById('rank-message');

        // レベルとスコアに応じた評価
        if (score > (quizData.length * 150)) {
            rankText.textContent = "称号：炎のマスターマジシャン"; rankText.style.color = "#f1c40f";
            rankMessage.textContent = "完璧じゃ！もうこのレベルで教えることは何もない！";
        } else if (score > (quizData.length * 80)) {
            rankText.textContent = "称号：一人前のマジシャン"; rankText.style.color = "#3498db";
            rankMessage.textContent = "よくやった！次はさらに上のレベルか、パーフェクトを狙うのじゃ！";
        } else {
            rankText.textContent = "称号：見習いマジシャン"; rankText.style.color = "#95a5a6";
            rankMessage.textContent = "何度も挑戦して、炎の性質を体に覚えさせるのじゃ！";
        }
    }
</script>

</body>
</html>
