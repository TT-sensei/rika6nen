<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炎のマジシャン イグニスの秘密の実験室</title>
    <style>
        /* 全体のデザイン（マジックらしいダークな雰囲気） */
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
            background-color: #1a0b2e;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #game-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #2d1b4e;
            border: 4px solid #f39c12;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px #e67e22;
            position: relative;
        }
        h1, h2, h3 { color: #f1c40f; text-shadow: 2px 2px 4px #000; }
        
        /* 視覚エフェクト（画像代わりの絵文字表示エリア） */
        #visual-area {
            font-size: 60px;
            height: 100px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        /* 炎が揺れるアニメーション */
        .flame {
            animation: flicker 0.5s infinite alternate;
            display: inline-block;
        }
        @keyframes flicker {
            0% { transform: scale(1) rotate(-5deg); opacity: 1; text-shadow: 0 0 10px #ff0000; }
            100% { transform: scale(1.2) rotate(5deg); opacity: 0.8; text-shadow: 0 0 20px #ffaa00; }
        }
        /* 登場アニメーション */
        .pop-in { animation: pop 0.3s ease-out; }
        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* ボタンデザイン */
        .btn {
            display: block;
            width: 85%;
            margin: 10px auto;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #8e44ad, #2980b9);
            border: 2px solid #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            background: linear-gradient(45deg, #9b59b6, #3498db);
        }
        .btn:disabled { background: #7f8c8d; border-color: #95a5a6; cursor: not-allowed; transform: none; }
        
        /* タイマーとステータス */
        #status-bar {
            display: flex;
            justify-content: space-between;
            background-color: #000;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #f1c40f;
        }
        #timer-bar-container {
            width: 100%;
            height: 10px;
            background-color: #333;
            border-radius: 5px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        #timer-bar {
            height: 100%;
            width: 100%;
            background-color: #2ecc71;
            transition: width 1s linear, background-color 0.5s;
        }
        
        /* テキストボックス */
        #situation-box {
            background-color: #000;
            padding: 15px;
            border-radius: 8px;
            border: 2px dashed #9b59b6;
            margin-bottom: 15px;
            text-align: left;
            line-height: 1.6;
        }
        #explanation-box {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: bold;
            color: #fff;
        }
        #hint-btn {
            background: #d35400;
            width: auto;
            display: inline-block;
            padding: 5px 15px;
            margin-top: -10px;
            margin-bottom: 10px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="title-screen">
        <div style="font-size: 80px; margin: 20px 0;">🪄<span class="flame">🔥</span>🎩</div>
        <h1>炎のマジシャン<br>イグニスの秘密の実験室</h1>
        <p>「我が弟子よ、炎の謎を解き明かし、<br>マスター・マジシャンを目指すのじゃ！」</p>
        <button class="btn" style="background: linear-gradient(45deg, #e67e22, #e74c3c);" onclick="startGame()">マジックショーを開演する</button>
    </div>

    <div id="game-screen" class="hidden">
        <div id="status-bar">
            <span id="stage-display">ステージ: 1</span>
            <span id="score-display">魔力ポイント: 0</span>
        </div>
        
        <div id="timer-bar-container">
            <div id="timer-bar"></div>
        </div>

        <h2 id="stage-title">ステージタイトル</h2>
        
        <div id="visual-area"></div>

        <div id="situation-box">
            <p id="situation-text">イグニスのセリフと状況</p>
        </div>
        
        <button id="hint-btn" class="btn" onclick="showHint()">💡 ヒントを見る</button>
        <p id="hint-text" class="hidden" style="color: #f1c40f; font-size: 14px;"></p>

        <h3 id="question-text">問題文</h3>
        
        <div id="choices-container">
            </div>

        <div id="explanation-box">
            <h3 id="result-mark" style="margin:0; font-size: 24px;"></h3>
            <p id="explanation-text">解説文</p>
            <button class="btn" id="next-btn" style="background: #2c3e50;" onclick="nextQuestion()">次のマジックへ 🪄</button>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <div style="font-size: 80px; margin: 20px 0;">✨🎓✨</div>
        <h1>ショー終了！</h1>
        <h2>獲得した魔力ポイント: <span id="final-score">0</span></h2>
        <h2 id="rank-text">ランク</h2>
        <p id="rank-message">メッセージ</p>
        <button class="btn" style="background: linear-gradient(45deg, #e67e22, #e74c3c);" onclick="location.reload()">もう一度挑戦する</button>
    </div>
</div>

<script>
    // 全4ステージのクイズデータ
    const quizData = [
        {
            stageTitle: "第1幕：消えない炎のイリュージョン",
            visual: "🫙 <span class='flame'>🔥</span> 💨",
            situation: "イグニス「底のないビンをろうそくにかぶせたぞ。ねん土で密着させると火は消えるが、ねん土にすき間を開け、ふたを開けた時だけ火が燃え続けた。」",
            question: "火が燃え続けた理由はどれだ？",
            choices: [
                "魔法の風が吹いて火を強くしたから",
                "空気が下から入って上へ出ていき、入れかわったから",
                "ビンの魔法で新しい空気が作られたから"
            ],
            correctIndex: 1,
            hint: "ヒント：線香の煙を近づけると、下から吸い込まれて上へ抜けていくぞ。",
            explanation: "ものが燃え続けるためには【たえず空気が入れかわる】必要があるのじゃ！"
        },
        {
            stageTitle: "第2幕：3つの気体のマジックボックス",
            visual: "📦 <span class='flame' style='font-size: 80px;'>🔥</span> ✨",
            situation: "イグニス「酸素・二酸化炭素・ちっ素、3つの見えない気体が入ったビンを用意した。ここに火のついたろうそくを入れるぞ！」",
            question: "他の気体よりも【激しく】物を燃やす働きがある気体はどれだ？",
            choices: ["ちっ素", "二酸化炭素", "酸素"],
            correctIndex: 2,
            hint: "ヒント：人間が呼吸で吸い込んでいる、あの気体じゃよ！",
            explanation: "【酸素】には、ものを燃やすはたらきがある。ちっ素や二酸化炭素に入れると、火はすぐに消えてしまうんじゃ。"
        },
        {
            stageTitle: "第3幕：透明な水が白くにごる魔法",
            visual: "🫙 🪄 🥛",
            situation: "イグニス「ものが燃えた後のビンに『魔法の水（石灰水）』を入れ、ビンを振って混ぜると、透明だった水が真っ白ににごったぞ！」",
            question: "石灰水を白くにごらせた、この気体の正体はなんだ？",
            choices: ["酸素", "二酸化炭素", "水蒸気"],
            correctIndex: 1,
            hint: "ヒント：ものが燃えると、酸素が使われて『この気体』ができるんじゃ。",
            explanation: "石灰水は【二酸化炭素】が混じると白くにごる性質がある。これで燃えた後に二酸化炭素ができたことが証明されたな！"
        },
        {
            stageTitle: "第4幕：見えない割合を見破る透視",
            visual: "📏 👁️ 💨",
            situation: "イグニス「最後に『気体検知管』という道具で、燃える前と後の空気を透視するぞ。燃える前、酸素は約21%だった。」",
            question: "ろうそくが燃えた後、酸素の割合はどう変化したかな？",
            choices: [
                "約21%のまま変わらない",
                "約17%に減った",
                "約30%に増えた"
            ],
            correctIndex: 1,
            hint: "ヒント：ものが燃えるときに酸素は「使われる」のじゃったな？",
            explanation: "ものが燃えると、空気中の酸素の一部が使われて【減り】、代わりに二酸化炭素が【増える】のじゃよ！"
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let timeLeft = 15; // 制限時間15秒
    let timerInterval;

    // HTML要素
    const ui = {
        titleScreen: document.getElementById('title-screen'),
        gameScreen: document.getElementById('game-screen'),
        resultScreen: document.getElementById('result-screen'),
        stageTitle: document.getElementById('stage-title'),
        visualArea: document.getElementById('visual-area'),
        situationText: document.getElementById('situation-text'),
        questionText: document.getElementById('question-text'),
        choicesContainer: document.getElementById('choices-container'),
        explanationBox: document.getElementById('explanation-box'),
        explanationText: document.getElementById('explanation-text'),
        resultMark: document.getElementById('result-mark'),
        nextBtn: document.getElementById('next-btn'),
        scoreDisplay: document.getElementById('score-display'),
        stageDisplay: document.getElementById('stage-display'),
        timerBar: document.getElementById('timer-bar'),
        hintBtn: document.getElementById('hint-btn'),
        hintText: document.getElementById('hint-text')
    };

    function startGame() {
        ui.titleScreen.classList.add('hidden');
        ui.gameScreen.classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        // 初期化
        ui.explanationBox.style.display = 'none';
        ui.choicesContainer.innerHTML = '';
        ui.hintText.classList.add('hidden');
        ui.hintBtn.disabled = false;
        
        const q = quizData[currentQuestionIndex];
        ui.stageDisplay.textContent = `ステージ: ${currentQuestionIndex + 1} / ${quizData.length}`;
        ui.stageTitle.textContent = q.stageTitle;
        ui.visualArea.innerHTML = q.visual;
        ui.visualArea.classList.add('pop-in');
        
        setTimeout(() => ui.visualArea.classList.remove('pop-in'), 300); // アニメーションリセット

        ui.situationText.textContent = q.situation;
        ui.questionText.textContent = q.question;
        ui.hintText.textContent = q.hint;

        // 選択肢の生成
        q.choices.forEach((choice, index) => {
            const button = document.createElement('button');
            button.className = 'btn';
            button.textContent = choice;
            button.onclick = () => checkAnswer(index);
            ui.choicesContainer.appendChild(button);
        });

        startTimer();
    }

    function startTimer() {
        timeLeft = 15;
        ui.timerBar.style.width = '100%';
        ui.timerBar.style.backgroundColor = '#2ecc71'; // 緑

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            const percentage = (timeLeft / 15) * 100;
            ui.timerBar.style.width = `${percentage}%`;

            if (timeLeft <= 5) {
                ui.timerBar.style.backgroundColor = '#e74c3c'; // 残り5秒で赤に
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                checkAnswer(-1); // 時間切れは -1 を渡す
            }
        }, 1000);
    }

    function showHint() {
        ui.hintText.classList.remove('hidden');
        ui.hintBtn.disabled = true; // ヒントは1回だけ
    }

    function checkAnswer(selectedIndex) {
        clearInterval(timerInterval); // タイマー停止

        // ボタン無効化
        const buttons = ui.choicesContainer.querySelectorAll('button');
        buttons.forEach(btn => btn.disabled = true);
        ui.hintBtn.disabled = true;

        const q = quizData[currentQuestionIndex];
        
        if (selectedIndex === q.correctIndex) {
            // 正解（残り時間でボーナスポイント）
            const points = 100 + (timeLeft * 10);
            score += points;
            ui.scoreDisplay.textContent = `魔力ポイント: ${score}`;
            ui.explanationBox.style.backgroundColor = '#27ae60';
            ui.resultMark.textContent = "⭕ お見事じゃ！";
        } else if (selectedIndex === -1) {
            // 時間切れ
            ui.explanationBox.style.backgroundColor = '#c0392b';
            ui.resultMark.textContent = "⏰ 時間切れじゃ！";
        } else {
            // 不正解
            ui.explanationBox.style.backgroundColor = '#c0392b';
            ui.resultMark.textContent = "❌ むむ、違うぞ！";
        }

        ui.explanationText.textContent = q.explanation;
        ui.explanationBox.style.display = 'block';

        if (currentQuestionIndex === quizData.length - 1) {
            ui.nextBtn.textContent = "結果を見る 🎓";
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        ui.gameScreen.classList.add('hidden');
        ui.resultScreen.classList.remove('hidden');
        
        document.getElementById('final-score').textContent = score;
        const rankText = document.getElementById('rank-text');
        const rankMessage = document.getElementById('rank-message');

        // 最高得点は (100+15*10) * 4 = 1000点
        if (score >= 800) {
            rankText.textContent = "称号：炎のマスターマジシャン";
            rankText.style.color = "#f1c40f";
            rankMessage.textContent = "素晴らしい！お前はすでに炎と気体を完全に支配しておる！";
        } else if (score >= 400) {
            rankText.textContent = "称号：一人前のマジシャン";
            rankText.style.color = "#3498db";
            rankMessage.textContent = "よくやった！あと少しでマスターじゃ。";
        } else {
            rankText.textContent = "称号：見習いマジシャン";
            rankText.style.color = "#95a5a6";
            rankMessage.textContent = "まだまだ修行が必要じゃな。復習して出直してこい！";
        }
    }
</script>

</body>
</html>
